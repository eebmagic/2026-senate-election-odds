<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2026 Senate control map</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent; font-family: Helvetica, Arial, sans-serif; }
  #wrap { position: relative; width: 100%; height: 100%; }
  svg { width: 100%; height: 100%; display: block; }
  path.state { stroke: #faf8f4; stroke-width: 1; cursor: pointer; }
  path.state:hover { stroke: #211f1c; stroke-width: 1.5; }
  #tooltip {
    position: absolute; pointer-events: none; z-index: 10;
    background: #211f1c; color: #faf8f4; padding: 8px 11px; border-radius: 4px;
    font-size: 12.5px; line-height: 1.5; max-width: 230px; opacity: 0; transition: opacity .08s;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  #tooltip b { display: block; font-size: 13.5px; margin-bottom: 2px; }
  #tooltip .row { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
  #tooltip .odds { color: #cfcac0; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="map" viewBox="0 0 975 610"></svg>
  <div id="tooltip"></div>
</div>
<script type="module">
import { buildStateSummaries, COLORS, fmtPct, isMaterialIndependent, isPrimaryPending } from './data.js';

const FIPS_TO_POSTAL = {
  '01':'AL','02':'AK','04':'AZ','05':'AR','06':'CA','08':'CO','09':'CT','10':'DE','11':'DC',
  '12':'FL','13':'GA','15':'HI','16':'ID','17':'IL','18':'IN','19':'IA','20':'KS','21':'KY',
  '22':'LA','23':'ME','24':'MD','25':'MA','26':'MI','27':'MN','28':'MS','29':'MO','30':'MT',
  '31':'NE','32':'NV','33':'NH','34':'NJ','35':'NM','36':'NY','37':'NC','38':'ND','39':'OH',
  '40':'OK','41':'OR','42':'PA','44':'RI','45':'SC','46':'SD','47':'TN','48':'TX','49':'UT',
  '50':'VT','51':'VA','53':'WA','54':'WV','55':'WI','56':'WY','72':'PR'
};

const summaries = buildStateSummaries();
const byPostal = {};
summaries.forEach(s => { byPostal[s.state] = s; });

const svg = d3.select('#map');
const tooltip = d3.select('#tooltip');
const wrap = document.getElementById('wrap');

svg.append('defs').append('pattern')
  .attr('id', 'stripes')
  .attr('width', 8).attr('height', 8)
  .attr('patternTransform', 'rotate(45)')
  .attr('patternUnits', 'userSpaceOnUse')
  .call(p => {
    p.append('rect').attr('width', 8).attr('height', 8).attr('fill', COLORS.rep);
    p.append('rect').attr('width', 4).attr('height', 8).attr('fill', COLORS.dem);
  });

function fillFor(summary) {
  if (!summary) return COLORS.neutral;
  if (summary.status === 'tossup' || summary.status === 'split') return 'url(#stripes)';
  return summary.party === 'D' ? COLORS.dem : COLORS.rep;
}

function tooltipHtml(summary, name) {
  if (!summary) return '<b>' + name + '</b>';
  let html = '<b>' + name + '</b>';
  summary.seats.forEach(seat => {
    if (!seat.isRace) {
      html += '<div class="row"><span>' + seat.senator + '</span><span class="odds">' + (seat.party === 'D' ? 'D' : 'R') + '</span></div>';
    } else {
      const r = seat.race;
      html += '<div class="row"><span>' + r.demCandidate + (isPrimaryPending(r.demCandidate) ? ' (TBD)' : '') + '</span><span class="odds">D ' + fmtPct(r.demProbability) + '</span></div>';
      html += '<div class="row"><span>' + r.repCandidate + (isPrimaryPending(r.repCandidate) ? ' (TBD)' : '') + '</span><span class="odds">R ' + fmtPct(r.repProbability) + '</span></div>';
      if (isMaterialIndependent(r)) {
        r.otherTickers.forEach(o => {
          html += '<div class="row"><span>' + o.candidate + ' (I)</span><span class="odds">' + fmtPct(o.probability) + '</span></div>';
        });
      }
    }
  });
  return html;
}

fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
  .then(r => r.json())
  .then(topology => {
    const geo = topojson.feature(topology, topology.objects.states);
    const projection = d3.geoAlbersUsa().fitSize([960, 600], geo);
    const path = d3.geoPath().projection(projection);

    svg.append('g')
      .selectAll('path')
      .data(geo.features)
      .join('path')
      .attr('class', 'state')
      .attr('d', path)
      .attr('fill', d => {
        const postal = FIPS_TO_POSTAL[d.id];
        return fillFor(byPostal[postal]);
      })
      .on('mousemove', (event, d) => {
        const postal = FIPS_TO_POSTAL[d.id];
        if (postal === 'DC' || postal === 'PR') return;
        const rect = wrap.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        tooltip
          .style('opacity', 1)
          .style('left', Math.min(x + 14, rect.width - 240) + 'px')
          .style('top', Math.max(y - 60, 4) + 'px')
          .html(tooltipHtml(byPostal[postal], d.properties.name));
      })
      .on('mouseleave', () => tooltip.style('opacity', 0));
  });
</script>
</body>
</html>
